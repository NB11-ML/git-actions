name: GitHub-Hosted Environments
on: [push, workflow_dispatch]

jobs:
  ubuntu-job:
    runs-on: ubuntu-latest
    steps:
      - name: System Info
        run: echo "OS ➔ ${{ runner.os }} | Hostname ➔ $(hostname) | User ➔ $(whoami)"

      - name: Verify Pre-installed SRE Tools
        run: |
          docker --version
          python3 --version
          node --version
          git --version

  windows-job:
    runs-on: windows-latest
    steps:
      - name: System Info
        run: Write-Host "OS ➔ ${{ runner.os }} | Hostname ➔ $env:COMPUTERNAME | User ➔ $env:USERNAME"

  macos-job:
    runs-on: macos-latest
    steps:
      - name: System Info
        run: echo "OS ➔ ${{ runner.os }} | Hostname ➔ $(hostname) | User ➔ $(whoami)"
