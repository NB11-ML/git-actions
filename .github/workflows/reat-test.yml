name: CI Quality Gate
on: push

jobs:
  execute-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Shell Validation Script
        # Assumes a script named 'test.sh' exists in your repo root
        run: |
          chmod +x test.sh
          ./test.sh
